<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Course - Employee Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eaf7ff;
            color: #333;
        }

        .header {
            background-color: #4db8e8;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 10px;
            font-size: 16px;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            border: 1px solid #b5dff2;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #168ac0;
            margin-top: 0;
            border-bottom: 2px solid #4db8e8;
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            border-color: #4db8e8;
            outline: none;
        }

        .submit-btn {
            background-color: #168ac0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0d6f9b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #8fc9e3;
        }

        th {
            background-color: #4db8e8;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 11px;
            text-align: center;
            background-color: #f8fcff;
        }

        tr:hover td {
            background-color: #e3f5fc;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->

    <div class="header">
        <h1>Welcome to Git Course</h1>
        <p>Employee Management System</p>
    </div>


    <div class="container">

        <!-- Employee Form -->

        <div class="card">

            <h2>Add Employee</h2>

            <form method="POST" action="/add_employee">

                <div class="form-row">

                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="number" name="id" placeholder="Enter Employee ID" required>
                    </div>

                    <div class="form-group">
                        <label>Employee Name</label>
                        <input type="text" name="name" placeholder="Enter Employee Name" required>
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" name="department" placeholder="Enter Department" required>
                    </div>

                    <div class="form-group">
                        <label>Salary</label>
                        <input type="number" name="salary" placeholder="Enter Salary" required>
                    </div>

                </div>


                <button type="submit" class="submit-btn">
                    Add Employee
                </button>

            </form>

        </div>


        <!-- Employee Table -->

        <div class="card">

            <h2>Employee Details</h2>

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                    </tr>
                </thead>

                <tbody>

				{% for employee in employees %}
			<tr>
    				<td>{{ employee.id }}</td>
    				<td>{{ employee.name }}</td>
    				<td>{{ employee.department }}</td>
    				<td>{{ employee.salary }}</td>
</tr>
{% endfor %}
                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        © 2026 DevOps Course | Employee Management System
    </div>

</body>

</html>
